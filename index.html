<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>去留裁定 — 物品審查表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ECE5D4;
    --paper-dark:#DED4BC;
    --ink:#1F2A44;
    --ink-light:#46527A;
    --ink-faint:#8791A8;
    --brass:#A9884F;
    --stamp-red:#A63D2F;
    --stamp-green:#3F6B4A;
    --line:#C9BDA0;
    --card:#F5F0E3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(169,136,79,0.08), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(31,42,68,0.06), transparent 45%);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    min-height:100vh;
    padding:32px 20px 80px;
  }
  .wrap{max-width:980px; margin:0 auto;}

  header.top{
    display:flex; align-items:flex-end; justify-content:space-between;
    border-bottom:3px double var(--ink);
    padding-bottom:14px; margin-bottom:28px; flex-wrap:wrap; gap:10px;
  }
  header.top h1{
    font-family:'Noto Serif TC', serif; font-weight:900;
    font-size:clamp(26px,4vw,38px); margin:0; letter-spacing:.04em;
  }
  header.top .sub{
    font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--ink-light);
    letter-spacing:.08em; text-transform:uppercase;
  }
  header.top .file-no{
    font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--ink-faint);
    text-align:right;
  }

  .gh-bar{
    display:flex; justify-content:flex-end; gap:10px; margin-bottom:18px; flex-wrap:wrap;
  }

  .layout{display:grid; grid-template-columns:1.3fr 1fr; gap:28px; align-items:start;}
  @media(max-width:800px){ .layout{grid-template-columns:1fr;} }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    box-shadow:0 1px 0 var(--line), 0 8px 22px -14px rgba(31,42,68,.35);
    padding:26px 26px 22px;
    position:relative;
  }
  .card::before{
    content:'';
    position:absolute; inset:6px;
    border:1px solid rgba(31,42,68,0.12);
    pointer-events:none;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--brass); margin-bottom:6px; font-weight:700;
  }
  h2{
    font-family:'Noto Serif TC', serif; font-size:21px; margin:0 0 16px;
    font-weight:700; color:var(--ink);
  }
  p.help{color:var(--ink-light); font-size:14px; line-height:1.7; margin:0 0 18px;}

  input[type=text], textarea{
    width:100%; font-family:'Noto Sans TC', sans-serif; font-size:15px;
    padding:10px 12px; border:1px solid var(--line); background:#fff;
    color:var(--ink); border-radius:2px;
  }
  textarea{resize:vertical; min-height:60px;}
  label.field-label{
    display:block; font-size:12.5px; color:var(--ink-light); margin:0 0 6px;
    font-weight:500; letter-spacing:.02em;
  }
  .field{margin-bottom:18px;}

  .btnrow{display:flex; gap:10px; flex-wrap:wrap; margin-top:4px;}
  button{
    font-family:'Noto Sans TC', sans-serif; font-size:14px; font-weight:500;
    padding:10px 18px; border:1px solid var(--ink); background:transparent;
    color:var(--ink); cursor:pointer; border-radius:2px; transition:all .15s ease;
  }
  button:hover{background:var(--ink); color:var(--paper);}
  button.primary{background:var(--ink); color:var(--card);}
  button.primary:hover{background:var(--ink-light); border-color:var(--ink-light);}
  button.gh-save{background:#2da44e; border-color:#2da44e; color:#fff;}
  button.gh-save:hover{background:#2c974b; border-color:#2c974b; color:#fff;}
  button.ghost{border-color:var(--line); color:var(--ink-light);}
  button.ghost:hover{background:var(--ink-light); color:var(--card); border-color:var(--ink-light);}
  button:disabled{opacity:.35; cursor:not-allowed;}
  button:disabled:hover{background:transparent; color:var(--ink);}

  .tendency-choice{display:flex; gap:10px; flex-wrap:wrap;}
  .tendency-choice button{flex:1; min-width:110px;}
  .tendency-choice button.sel{background:var(--brass); border-color:var(--brass); color:#fff;}

  .qlist{list-style:none; margin:0; padding:0;}
  .qlist li{
    display:grid; grid-template-columns:1fr auto; gap:14px; align-items:center;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .qlist li:last-child{border-bottom:none;}
  .qtext{font-size:14.5px; line-height:1.6;}
  .qtext .qnum{
    font-family:'JetBrains Mono', monospace; color:var(--brass); font-weight:700;
    margin-right:6px;
  }
  .seg{display:flex; border:1px solid var(--ink); border-radius:2px; overflow:hidden; flex-shrink:0;}
  .seg button{
    border:none; border-right:1px solid var(--ink); padding:7px 12px; font-size:12.5px;
    background:transparent; margin:0; border-radius:0;
  }
  .seg button:last-child{border-right:none;}
  .seg button.sel{background:var(--ink); color:var(--card);}
  .seg button.sel.yes{background:var(--stamp-red); border-color:var(--stamp-red); color:#fff;}
  .seg button.sel.no{background:var(--stamp-green); border-color:var(--stamp-green); color:#fff;}
  .seg button.sel.na{background:var(--ink-faint); border-color:var(--ink-faint); color:#fff;}

  .stepnav{display:flex; justify-content:space-between; margin-top:22px;}

  .progress{
    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-faint);
    letter-spacing:.1em; margin-bottom:16px; text-transform:uppercase;
  }

  /* verdict stamp */
  .verdict-box{text-align:center; padding:10px 0 4px;}
  .stamp{
    display:inline-block; border:5px double; border-radius:50%;
    width:150px; height:150px; display:flex; align-items:center; justify-content:center;
    flex-direction:column; transform:rotate(-9deg); font-family:'Noto Serif TC', serif;
    font-weight:900; margin:6px auto 14px; animation:stamp-in .35s ease-out;
  }
  @keyframes stamp-in{
    0%{transform:rotate(-9deg) scale(1.6); opacity:0;}
    100%{transform:rotate(-9deg) scale(1); opacity:1;}
  }
  .stamp.dispose{border-color:var(--stamp-red); color:var(--stamp-red);}
  .stamp.keep{border-color:var(--stamp-green); color:var(--stamp-green);}
  .stamp.split{border-color:var(--brass); color:var(--brass);}
  .stamp .big{font-size:28px; letter-spacing:.06em;}
  .stamp .small{font-size:11px; font-family:'JetBrains Mono', monospace; letter-spacing:.1em; margin-top:4px;}

  .reason-list{text-align:left; font-size:13.5px; line-height:1.8; color:var(--ink-light); margin-top:10px;}
  .reason-list b{color:var(--ink);}
  .warn{
    background:rgba(166,61,47,0.08); border-left:3px solid var(--stamp-red);
    padding:10px 14px; font-size:13px; color:var(--ink); margin-top:14px; line-height:1.7;
  }

  /* ledger (獨立滾動區塊優化) */
  .ledger h2{margin-bottom:10px;}
  .ledger-filter{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .ledger-filter button{
    padding:4px 10px; font-size:12px; border:1px solid var(--line); border-radius:12px;
  }
  .ledger-filter button.active{
    background:var(--ink); color:var(--card); border-color:var(--ink);
  }
  .ledger-scroll{
    max-height:500px;
    overflow-y:auto;
    padding-right:6px;
  }
  /* 美化滾動條 */
  .ledger-scroll::-webkit-scrollbar { width:5px; }
  .ledger-scroll::-webkit-scrollbar-track { background:transparent; }
  .ledger-scroll::-webkit-scrollbar-thumb { background:var(--line); border-radius:3px; }

  .ledger-empty{color:var(--ink-faint); font-size:13.5px; padding:20px 0; text-align:center;}
  .entry{
    border-bottom:1px solid var(--line); padding:14px 0; cursor:pointer;
  }
  .entry:last-child{border-bottom:none;}
  .entry-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
  .entry-name{font-weight:700; font-size:14.5px;}
  .entry-verdict{
    font-family:'JetBrains Mono', monospace; font-size:11px; padding:2px 8px;
    border-radius:10px; white-space:nowrap; font-weight:700;
  }
  .entry-verdict.dispose{background:rgba(166,61,47,0.14); color:var(--stamp-red);}
  .entry-verdict.keep{background:rgba(63,107,74,0.14); color:var(--stamp-green);}
  .entry-verdict.split{background:rgba(169,136,79,0.16); color:var(--brass);}
  .entry-date{font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--ink-faint); margin-top:3px;}
  .entry-detail{
    display:none; font-size:12.5px; color:var(--ink-light); line-height:1.7; margin-top:8px;
    white-space:pre-line;
  }
  .entry.open .entry-detail{display:block;}
  .entry-del{
    font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--ink-faint);
    background:none; border:none; padding:2px 4px; margin-top:6px; cursor:pointer;
  }
  .entry-del:hover{background:none; color:var(--stamp-red);}

  .framework-note{
    margin-top:26px; font-size:12px; color:var(--ink-faint); line-height:1.8;
    border-top:1px dashed var(--line); padding-top:14px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>去留裁定</h1>
      <div class="sub">Disposal Interrogation Tribunal · 三層審查架構</div>
    </div>
    <div class="file-no" id="fileNo">案卷編號 —</div>
  </header>

  <div class="gh-bar">
    <button onclick="saveToGitHub()" class="gh-save">Save to GitHub</button>
    <button onclick="configGitHub()" class="ghost">設定 GitHub Token</button>
  </div>

  <div class="layout">
    <!-- FORM CARD -->
    <div class="card" id="formCard"></div>

    <!-- LEDGER -->
    <div class="card ledger">
      <div class="eyebrow">歷史紀錄</div>
      <h2>裁定存檔</h2>
      <div class="ledger-filter">
        <button class="active" onclick="setFilter('all', this)">全部</button>
        <button onclick="setFilter('keep', this)">保留</button>
        <button onclick="setFilter('dispose', this)">處置</button>
        <button onclick="setFilter('split', this)">拆分</button>
      </div>
      <div class="ledger-scroll" id="ledgerList">
        <div class="ledger-empty">尚未有存檔紀錄</div>
      </div>
    </div>
  </div>

  <div class="framework-note">
    第一層：單一充分條件（過期／損壞不可修／已有替代品但臨棄捨不得／法定文件逾期）— 任一成立即判處置。<br>
    第二層：六項細則 — 無具體使用情境／僅剩熟悉感非回憶／沒有「備用」角色／搬遷節點前用不到／體積重量與猶豫成反比／環境限制型未使用。<br>
    第三層：長期閒置／可重購／無情感價值／短期不會使用。<br>
    誠實檢查：若您本已有明確傾向，架構結果僅供對照，不代表必須推翻直覺。
  </div>
</div>

<script>
const GH_CONFIG_KEY = 'tribunal_gh_config';
let state = {};
let ledger = [];
let ghSHA = null;
let currentFilter = 'all';

function resetState(){
  state = {
    step:0,
    name:'',
    tendency:null,     // 'keep' | 'dispose' | 'unsure'
    trustInstinct:null,
    splittable:null,
    splitNote:'',
    layer1:[null,null,null,null],
    layer2:[null,null,null,null,null,null],
    layer3:[null,null,null,null],
  };
}
resetState();

const L1 = [
  '已過期／已失去安全使用期限',
  '已損壞至無法修復，且維修成本高於重置成本',
  '已有功能相同或更佳、且正在實際使用中的替代品。但臨到棄置一刻就捨不得',
  '具法定時效文件，保存期限已過且無延續效力'
];
const L2 = [
  '說不出具體使用情境',
  '移除後只是「少了熟悉感」而非「失去具體回憶」',
  '沒有「備用」的角色',
  '在下一個搬遷節點前用不到，且不會隨身攜帶出境',
  '體積/重量偏大（大件更應優先處置）',
  '未使用是環境限制所致，且重置成本低／體積偏大（傾向處置的組合）'
];
const L3 = [
  '長期閒置',
  '可重新購買',
  '無情感價值',
  '短期內不會使用'
];

function render(){
  const c = document.getElementById('formCard');
  if(state.step===0) return renderStep0(c);
  if(state.step===1) return renderStep1(c);
  if(state.step===2) return renderStep2(c);
  if(state.step===3) return renderStep3(c);
  if(state.step===4) return renderStep4(c);
  if(state.step===5) return renderVerdict(c);
}

function renderStep0(c){
  c.innerHTML = `
    <div class="eyebrow">STEP 0 · 登記</div>
    <h2>物品登記</h2>
    <p class="help">請輸入要審查的物品名稱與簡述。</p>
    <div class="field">
      <label class="field-label">物品名稱</label>
      <input type="text" id="itemName" placeholder="例：紅色迷你背包" value="${escapeHtml(state.name)}">
    </div>
    <div class="btnrow">
      <button class="primary" onclick="submitName()">開始審查 →</button>
    </div>
  `;
  document.getElementById('itemName').focus();
}
function submitName(){
  const v = document.getElementById('itemName').value.trim();
  if(!v) return;
  state.name = v;
  state.step = 1;
  render();
}

function renderStep1(c){
  c.innerHTML = `
    <div class="progress">STEP 1 / 5 · 誠實傾向偵測</div>
    <h2>「${escapeHtml(state.name)}」— 你內心本來的傾向？</h2>
    <p class="help">在套用任何標準之前，先誠實回答。若傾向已很明確，標準測試容易變成事後找理由。</p>
    <div class="tendency-choice">
      <button onclick="setTendency('keep')" class="${state.tendency==='keep'?'sel':''}">本來就想留</button>
      <button onclick="setTendency('dispose')" class="${state.tendency==='dispose'?'sel':''}">本來就想丟</button>
      <button onclick="setTendency('unsure')" class="${state.tendency==='unsure'?'sel':''}">真的未定</button>
    </div>
    <div id="tendencyFollow"></div>
    <div class="stepnav">
      <button class="ghost" onclick="goBack()">← 上一步</button>
      <button class="primary" id="step1next" disabled onclick="afterStep1()">繼續 →</button>
    </div>
  `;
  renderTendencyFollow();
}
function setTendency(t){
  state.tendency = t;
  state.trustInstinct = null;
  renderTendencyFollow();
}
function renderTendencyFollow(){
  const el = document.getElementById('tendencyFollow');
  const nextBtn = document.getElementById('step1next');
  if(!state.tendency){ el.innerHTML=''; nextBtn.disabled = true; return; }
  if(state.tendency === 'unsure'){
    el.innerHTML = '';
    nextBtn.disabled = false;
    return;
  }
  el.innerHTML = `
    <div class="field" style="margin-top:14px;">
      <label class="field-label">既然傾向已經明確，是否仍要跑完整審查（誠實核對理由），還是尊重直覺、直接記錄？</label>
      <div class="btnrow">
        <button onclick="setTrust(true)" class="${state.trustInstinct===true?'sel':''}">尊重直覺，直接記錄</button>
        <button onclick="setTrust(false)" class="${state.trustInstinct===false?'sel':''}">仍要跑完整審查</button>
      </div>
    </div>
  `;
  nextBtn.disabled = state.trustInstinct===null;
}
function setTrust(v){
  state.trustInstinct = v;
  renderTendencyFollow();
}
function afterStep1(){
  if(state.tendency!=='unsure' && state.trustInstinct===true){
    finalizeInstinct();
    return;
  }
  state.step = 2;
  render();
}

function renderStep2(c){
  c.innerHTML = `
    <div class="progress">STEP 2 / 5 · 可拆分性</div>
    <h2>此物品是否可拆分處置？</h2>
    <p class="help">部分可拆解、可留部分內容而處置其餘（如相簿：留手寫頁、掃描存檔，其餘丟棄）。</p>
    <div class="tendency-choice">
      <button onclick="setSplit(true)" class="${state.splittable===true?'sel':''}">可以拆分</button>
      <button onclick="setSplit(false)" class="${state.splittable===false?'sel':''}">不可拆分／整體判斷</button>
    </div>
    ${state.splittable ? `
    <div class="field" style="margin-top:14px;">
      <label class="field-label">說明：哪部分保留，哪部分處置？</label>
      <textarea id="splitNote" oninput="state.splitNote=this.value">${escapeHtml(state.splitNote)}</textarea>
    </div>` : ''}
    <div class="stepnav">
      <button class="ghost" onclick="goBack()">← 上一步</button>
      <button class="primary" ${state.splittable===null?'disabled':''} onclick="afterStep2()">繼續 →</button>
    </div>
  `;
}
function setSplit(v){ state.splittable = v; render(); }
function afterStep2(){
  if(state.splittable === true){
    state.step = 5;
    render();
    return;
  }
  state.step = 3;
  render();
}

function renderStep3(c){
  const allAnswered = state.layer1.every(v=>v!==null);
  c.innerHTML = `
    <div class="progress">STEP 3 / 5 · 第一層：單一充分條件</div>
    <h2>是否符合以下任一條件？</h2>
    <p class="help">任一成立即構成充分理由，直接判定處置，無需再看下面兩層。</p>
    <ul class="qlist">
      ${L1.map((q,i)=>`
        <li>
          <div class="qtext"><span class="qnum">${i+1}</span>${q}</div>
          <div class="seg">
            <button class="${state.layer1[i]===true?'sel yes':''}" onclick="setL(1,${i},true)">是</button>
            <button class="${state.layer1[i]===false?'sel no':''}" onclick="setL(1,${i},false)">否</button>
          </div>
        </li>
      `).join('')}
    </ul>
    <div class="stepnav">
      <button class="ghost" onclick="goBack()">← 上一步</button>
      <button class="primary" ${!allAnswered?'disabled':''} onclick="afterStep3()">繼續 →</button>
    </div>
  `;
}
function setL(layer,i,v){
  state['layer'+layer][i] = v;
  render();
}
function afterStep3(){
  if(state.layer1.some(v=>v===true)){
    state.step = 5;
    render();
    return;
  }
  state.step = 4;
  render();
}

function renderStep4(c){
  const allAnswered = [...state.layer2,...state.layer3].every(v=>v!==null);
  c.innerHTML = `
    <div class="progress">STEP 4 / 5 · 第二、三層：綜合評估</div>
    <h2>逐項核對</h2>
    <p class="help">第一層未成立，需綜合評估。「符合」傾向處置，「不符合」傾向保留。</p>
    <div class="eyebrow" style="margin-top:4px;">第二層 · 六項細則</div>
    <ul class="qlist">
      ${L2.map((q,i)=>`
        <li>
          <div class="qtext"><span class="qnum">2.${i+1}</span>${q}</div>
          <div class="seg">
            <button class="${state.layer2[i]===true?'sel yes':''}" onclick="setL(2,${i},true)">符合</button>
            <button class="${state.layer2[i]===false?'sel no':''}" onclick="setL(2,${i},false)">不符合</button>
            <button class="${state.layer2[i]==='na'?'sel na':''}" onclick="setL(2,${i},'na')">不適用</button>
          </div>
        </li>
      `).join('')}
    </ul>
    <div class="eyebrow" style="margin-top:18px;">第三層 · 原始四項法則</div>
    <ul class="qlist">
      ${L3.map((q,i)=>`
        <li>
          <div class="qtext"><span class="qnum">3.${i+1}</span>${q}</div>
          <div class="seg">
            <button class="${state.layer3[i]===true?'sel yes':''}" onclick="setL(3,${i},true)">符合</button>
            <button class="${state.layer3[i]===false?'sel no':''}" onclick="setL(3,${i},false)">不符合</button>
            <button class="${state.layer3[i]==='na'?'sel na':''}" onclick="setL(3,${i},'na')">不適用</button>
          </div>
        </li>
      `).join('')}
    </ul>
    <div class="stepnav">
      <button class="ghost" onclick="goBack()">← 上一步</button>
      <button class="primary" ${!allAnswered?'disabled':''} onclick="()=>{}" id="finalBtn">得出裁定 →</button>
    </div>
  `;
  document.getElementById('finalBtn').onclick = ()=>{ state.step=5; render(); };
}

function computeVerdict(){
  if(state.splittable===true){
    return {
      type:'split',
      title:'拆分處置',
      sub:'PARTIAL DISPOSAL',
      reasons:[`拆分說明：${state.splitNote || '（未填寫）'}`, '不可取代部分建議保留或掃描存檔，其餘部分依標準處置。']
    };
  }
  if(state.layer1.some(v=>v===true)){
    const hit = L1.filter((q,i)=>state.layer1[i]===true);
    return {
      type:'dispose',
      title:'處置',
      sub:'DISPOSE · LAYER 1',
      reasons:['第一層單一充分條件成立：', ...hit.map(h=>'· '+h)]
    };
  }
  const l2yes = state.layer2.filter(v=>v===true).length;
  const l2no  = state.layer2.filter(v=>v===false).length;
  const l3yes = state.layer3.filter(v=>v===true).length;
  const l3no  = state.layer3.filter(v=>v===false).length;
  const disposeScore = l2yes + l3yes;
  const keepScore = l2no + l3no;
  let type, title, sub;
  if(disposeScore > keepScore){ type='dispose'; title='傾向處置'; sub='LEAN DISPOSE · LAYER 2-3'; }
  else if(keepScore > disposeScore){ type='keep'; title='傾向保留'; sub='LEAN KEEP · LAYER 2-3'; }
  else { type='keep'; title='勢均力敵（預設保留，留待下次覆核）'; sub='TIE · LAYER 2-3'; }

  const reasons = [
    `第二層：符合處置方向 ${l2yes} 項／符合保留方向 ${l2no} 項`,
    `第三層：符合處置方向 ${l3yes} 項／符合保留方向 ${l3no} 項`
  ];
  return {type,title,sub,reasons};
}

function renderVerdict(c){
  const v = computeVerdict();
  const conflictWarn = (state.tendency && state.tendency!=='unsure' &&
    ((state.tendency==='keep' && v.type==='dispose') || (state.tendency==='dispose' && v.type==='keep')))
    ? `<div class="warn">提醒：您原先的直覺傾向是「${state.tendency==='keep'?'想留':'想丟'}」，但客觀評估結果是「${v.title}」。建議誠實檢視：這份猶豫，究竟是理由不足，還是單純情感/習慣？</div>`
    : '';

  c.innerHTML = `
    <div class="progress">STEP 5 / 5 · 裁定</div>
    <h2>「${escapeHtml(state.name)}」裁定結果</h2>
    <div class="verdict-box">
      <div class="stamp ${v.type}">
        <div class="big">${v.title}</div>
        <div class="small">${v.sub}</div>
      </div>
      <div class="reason-list">
        ${v.reasons.map(r=>`<div>${escapeHtml(r)}</div>`).join('')}
      </div>
      ${conflictWarn}
    </div>
    <div class="btnrow" style="justify-content:center; margin-top:20px;">
      <button class="primary" onclick="saveEntry()">存入紀錄</button>
      <button class="ghost" onclick="startNew()">審查下一件</button>
    </div>
  `;
}

function finalizeInstinct(){
  const label = state.tendency==='keep' ? '保留（尊重直覺）' : '處置（尊重直覺）';
  const type = state.tendency==='keep' ? 'keep' : 'dispose';
  const c = document.getElementById('formCard');
  c.innerHTML = `
    <div class="progress">已完成 · 尊重直覺</div>
    <h2>「${escapeHtml(state.name)}」裁定結果</h2>
    <div class="verdict-box">
      <div class="stamp ${type}">
        <div class="big">${type==='keep'?'保留':'處置'}</div>
        <div class="small">INSTINCT HONOURED</div>
      </div>
      <div class="reason-list"><div>未跑完整審查，尊重既定直覺傾向。</div></div>
    </div>
    <div class="btnrow" style="justify-content:center; margin-top:20px;">
      <button class="primary" onclick="saveEntryDirect('${type}','${escapeHtml(label)}')">存入紀錄</button>
      <button class="ghost" onclick="startNew()">審查下一件</button>
    </div>
  `;
}

function saveEntryDirect(type,label){
  addLedgerEntry(state.name, type, label);
  startNew();
}
function saveEntry(){
  const v = computeVerdict();
  const detail = v.reasons.join('\n');
  addLedgerEntry(state.name, v.type, `${v.title}\n${detail}`);
  startNew();
}

function startNew(){
  resetState();
  render();
}
function goBack(){
  state.step = Math.max(0, state.step-1);
  render();
}

/* ---------- Persistence & GitHub Sync ---------- */
function getGHConfig(){
  const cfg = localStorage.getItem(GH_CONFIG_KEY);
  return cfg ? JSON.parse(cfg) : null;
}

async function fetchGitHubUser(token){
  try {
    const res = await fetch('https://api.github.com/user', {
      headers: {
        'Authorization': `token ${token}`,
        'Accept': 'application/vnd.github.v3+json'
      }
    });
    if(res.ok){
      const data = await res.json();
      return data.login;
    }
  } catch(e) {
    console.error("無法取得 GitHub 用戶資訊:", e);
  }
  return null;
}

async function configGitHub(){
  const cfg = getGHConfig() || {};
  const token = prompt("請輸入 GitHub Personal Access Token:", cfg.token || "");
  if(!token) return;

  const repo = prompt("請輸入 Repository 名稱:", cfg.repo || "");
  if(!repo) return;

  const path = prompt("請輸入 JSON 檔案路徑 (預設 data.json):", cfg.path || "data.json");

  const owner = await fetchGitHubUser(token);
  if(!owner){
    alert("Token 驗證失敗，請重新檢查您的 Token 權限。");
    return;
  }

  const config = { owner, repo, path: path || "data.json", token };
  localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(config));
  alert(`GitHub 設定完成！已自動對接帳號：${owner}`);
  loadFromGitHub();
}

async function loadLedger(){
  const cfg = getGHConfig();
  if (cfg && cfg.token) {
    const success = await loadFromGitHub();
    if (success) return;
  }
  loadFromLocalStorage();
}

async function loadFromGitHub(){
  const cfg = getGHConfig();
  if(!cfg) return false;

  const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`;
  try {
    const res = await fetch(url, {
      headers: {
        'Authorization': `token ${cfg.token}`,
        'Accept': 'application/vnd.github.v3+json'
      }
    });

    if(res.ok){
      const data = await res.json();
      ghSHA = data.sha;
      const content = decodeURIComponent(escape(atob(data.content)));
      ledger = JSON.parse(content);
      renderLedger();
      return true;
    }
  } catch(e) {
    console.error("GitHub 連線失敗:", e);
  }
  return false;
}

function saveToLocalStorage(){
  try {
    localStorage.setItem('tribunal_ledger', JSON.stringify(ledger));
  } catch(e) {
    console.error('Local save failed', e);
  }
}

function loadFromLocalStorage(){
  try {
    const data = localStorage.getItem('tribunal_ledger');
    if(data) ledger = JSON.parse(data);
  } catch(e) {
    console.error('Local load failed', e);
  }
  renderLedger();
}

function addLedgerEntry(name, verdictType, detail){
  const entry = {
    id: 'i' + Date.now(),
    name, verdictType, detail,
    date: new Date().toLocaleString('zh-Hant', {hour12:false})
  };
  ledger.unshift(entry);
  saveToLocalStorage();
  renderLedger();
}

function deleteEntry(id){
  const entry = ledger.find(e => e.id === id);
  const name = entry ? entry.name : '此項目';
  
  if (confirm(`確定要刪除「${name}」的裁定紀錄嗎？`)) {
    ledger = ledger.filter(e => e.id !== id);
    saveToLocalStorage();
    renderLedger();
  }
}

async function saveToGitHub(){
  const cfg = getGHConfig();
  if(!cfg || !cfg.token){
    alert("請先點擊『設定 GitHub Token』配置存儲庫資訊。");
    return configGitHub();
  }

  if(!ghSHA){
    await loadFromGitHub();
  }

  const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`;
  const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(ledger, null, 2))));

  const bodyData = {
    message: `Update tribunal ledger [${new Date().toLocaleString()}]`,
    content: contentEncoded,
    sha: ghSHA
  };

  try {
    const res = await fetch(url, {
      method: 'PUT',
      headers: {
        'Authorization': `token ${cfg.token}`,
        'Content-Type': 'application/json',
        'Accept': 'application/vnd.github.v3+json'
      },
      body: JSON.stringify(bodyData)
    });

    if(res.ok){
      const resData = await res.json();
      ghSHA = resData.content.sha;
      alert("成功同步並儲存至 GitHub！");
    } else {
      const err = await res.json();
      alert(`GitHub 儲存失敗：${err.message}`);
    }
  } catch(e) {
    alert(`儲存出錯：${e.message}`);
  }
}

function setFilter(filterType, btnEl){
  currentFilter = filterType;
  const btns = document.querySelectorAll('.ledger-filter button');
  btns.forEach(b => b.classList.remove('active'));
  if(btnEl) btnEl.classList.add('active');
  renderLedger();
}

function renderLedger(){
  const el = document.getElementById('ledgerList');
  document.getElementById('fileNo').textContent = '案卷編號 №' + String(ledger.length).padStart(3,'0');
  
  if(ledger.length===0){
    el.innerHTML = '<div class="ledger-empty">尚未有存檔紀錄</div>';
    return;
  }

  const filtered = currentFilter === 'all' 
    ? ledger 
    : ledger.filter(e => e.verdictType === currentFilter);

  if(filtered.length===0){
    el.innerHTML = '<div class="ledger-empty">無此類別的紀錄</div>';
    return;
  }

  el.innerHTML = filtered.map(e=>`
    <div class="entry" onclick="toggleEntry(this)">
      <div class="entry-top">
        <div class="entry-name">${escapeHtml(e.name)}</div>
        <div class="entry-verdict ${e.verdictType}">${verdictLabel(e.verdictType)}</div>
      </div>
      <div class="entry-date">${e.date}</div>
      <div class="entry-detail">${escapeHtml(e.detail)}</div>
      <button class="entry-del" onclick="event.stopPropagation(); deleteEntry('${e.id}')">刪除紀錄</button>
    </div>
  `).join('');
}

function verdictLabel(t){
  if(t==='dispose') return '處置';
  if(t==='keep') return '保留';
  if(t==='split') return '拆分';
  return t;
}

function toggleEntry(el){ el.classList.toggle('open'); }

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

render();
loadLedger();
</script>
</body>
